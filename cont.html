<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Unique Modal</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #667eea, #764ba2);
      }

      /* Trigger Card */
      .card {
        width: 300px;
        background: #fff;
        border-radius: 25px;
        overflow: hidden;
        cursor: pointer;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        transition: 0.4s;
      }

      .card:hover {
        transform: translateY(-10px) scale(1.03);
      }

      .card img {
        width: 100%;
        height: 200px;
        object-fit: cover;
      }

      .card-content {
        padding: 20px;
      }

      .card-content h2 {
        margin-bottom: 10px;
      }

      .card-content p {
        color: #666;
      }

      /* Modal Background */
      .modal {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(8px);

        display: flex;
        align-items: center;
        justify-content: center;

        opacity: 0;
        visibility: hidden;
        transition: 0.4s;
      }

      .modal.active {
        opacity: 1;
        visibility: visible;
      }

      /* Modal Box */
      .modal-box {
        width: 85%;
        max-width: 900px;
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.3);

        border-radius: 35px;
        overflow: hidden;

        display: flex;

        transform: scale(0.7) rotate(-5deg);
        opacity: 0;
        transition: 0.5s ease;
      }

      .modal.active .modal-box {
        transform: scale(1) rotate(0);
        opacity: 1;
      }

      /* Left image */
      .modal-image {
        flex: 1;
        position: relative;
      }

      .modal-image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .tag {
        position: absolute;
        bottom: 20px;
        left: 20px;

        background: rgba(255, 255, 255, 0.2);
        color: white;

        padding: 10px 18px;
        border-radius: 30px;
        backdrop-filter: blur(8px);
      }

      /* Right content */
      .modal-content {
        flex: 1;
        background: white;
        padding: 50px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .modal-content span {
        color: #7c3aed;
        font-weight: bold;
      }

      .modal-content h1 {
        margin: 15px 0;
        font-size: 35px;
      }

      .modal-content p {
        color: #666;
        line-height: 1.7;
      }

      .btn {
        margin-top: 25px;
        padding: 14px 28px;
        border: none;
        border-radius: 50px;
        background: black;
        color: white;
        cursor: pointer;
        width: max-content;
        transition: 0.3s;
      }

      .btn:hover {
        transform: scale(1.08);
      }

      /* Close button */
      .close {
        position: absolute;
        top: 25px;
        right: 25px;
        width: 40px;
        height: 40px;

        border: none;
        border-radius: 50%;
        background: black;
        color: white;

        cursor: pointer;
        z-index: 100;
      }

      @media (max-width: 768px) {
        .modal-box {
          flex-direction: column;
        }

        .modal-image {
          height: 250px;
        }

        .modal-content {
          padding: 30px;
        }
      }
    </style>
  </head>

  <body>
    <div class="card" onclick="openModal()">
      <img src="https://picsum.photos/500/300" alt="" />

      <div class="card-content">
        <h2>Click To Open</h2>
        <p>Unique popup with image + content</p>
      </div>
    </div>

    <div class="modal" id="modal">
      <button class="close" onclick="closeModal()">✕</button>

      <div class="modal-box">
        <div class="modal-image">
          <img src="https://picsum.photos/600/700" alt="" />
          <div class="tag">✨ Featured Story</div>
        </div>

        <div class="modal-content">
          <span>Special Experience</span>

          <h1>Unique Popup Design</h1>

          <p>
            This is a premium modal with image and content. It uses
            glassmorphism, animations, blur effects, and a split layout for a
            modern feel.
          </p>

          <button class="btn">Explore More</button>
        </div>
      </div>
    </div>

    <script>
      function openModal() {
        document.getElementById("modal").classList.add("active");
      }

      function closeModal() {
        document.getElementById("modal").classList.remove("active");
      }

      window.onclick = (e) => {
        let modal = document.getElementById("modal");

        if (e.target === modal) {
          closeModal();
        }
      };
    </script>
  </body>
</html>
